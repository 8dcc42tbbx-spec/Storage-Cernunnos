name: Publish to GitHub Pages

# Keeps the public site in sync with this branch. Pages is served from the
# gh-pages branch, so this just rebuilds that branch's contents -- it needs
# only contents:write, not the Pages admin API (which the workflow token
# isn't allowed to call).

on:
  push:
    branches: [claude/cyclops-trivia-game-pxbdxz]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only what the game needs -- no build tooling or prompt notes.
      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r js site/
          cp -r assets site/
          rm -f site/assets/README.md
          touch site/.nojekyll

      - name: Push to gh-pages
        run: |
          cd site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
