<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRAPPED! Odysseus vs the Cyclops</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* The canvas is the entire interface -- answers are clicked directly on
           it. No HTML controls, so every pixel of the window goes to the game. */
        #stage { position: relative; line-height: 0; }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;
            display: block;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #scanlines {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.06) 2px,
                rgba(0,0,0,0.06) 4px
            );
        }
    </style>
</head>
<body>
    <div id="stage">
        <canvas id="game" width="320" height="240"></canvas>
        <div id="scanlines"></div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/pixelfont.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/dialogue.js"></script>
    <script src="js/images.js"></script>
    <script src="js/art.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>

    <script>
        window.addEventListener('load', function () {
            var canvas = document.getElementById('game');
            CY.Game.init(canvas);

            // Scale by whole numbers only, so every game pixel stays a crisp
            // square. Without this the canvas renders at its native 320x240 no
            // matter how big the display is.
            function fitCanvas() {
                var scale = Math.min(
                    Math.floor(window.innerWidth / 320),
                    Math.floor(window.innerHeight / 240)
                );
                if (!isFinite(scale) || scale < 1) scale = 1;
                canvas.style.width = (320 * scale) + 'px';
                canvas.style.height = (240 * scale) + 'px';
            }
            fitCanvas();
            window.addEventListener('resize', fitCanvas);
            window.addEventListener('orientationchange', fitCanvas);

            function toCanvas(e) {
                var r = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - r.left) * (320 / r.width),
                    y: (e.clientY - r.top) * (240 / r.height)
                };
            }

            function toggleFullscreen() {
                try {
                    if (!document.fullscreenElement) {
                        if (document.documentElement.requestFullscreen) {
                            document.documentElement.requestFullscreen().catch(function () {});
                        }
                    } else if (document.exitFullscreen) {
                        document.exitFullscreen().catch(function () {});
                    }
                } catch (e) { /* fullscreen unavailable; the page already fills the window */ }
            }

            canvas.addEventListener('pointermove', function (e) {
                var p = toCanvas(e);
                canvas.style.cursor = CY.Game.pointerMove(p.x, p.y) ? 'pointer' : 'default';
            });

            canvas.addEventListener('pointerdown', function (e) {
                e.preventDefault();
                var p = toCanvas(e);
                if (CY.Game.pointerClick(p.x, p.y) === 'FULLSCREEN') toggleFullscreen();
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
            });
            document.addEventListener('fullscreenchange', fitCanvas);
        });
    </script>
</body>
</html>
