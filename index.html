<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAPPED! Odysseus vs the Cyclops</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: monospace;
        }
        #stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;
            max-width: 100vw;
            max-height: 86vh;
            width: auto;
            height: auto;
            border: 2px solid #3a2a18;
        }
        #scanlines {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.06) 2px,
                rgba(0,0,0,0.06) 4px
            );
        }
        #legend {
            color: #d9c290;
            font-size: 13px;
            letter-spacing: 1px;
            text-align: center;
            padding: 10px 6px 4px;
            line-height: 1.6;
        }
        #legend b { color: #ffcc33; }
    </style>
</head>
<body>
    <div id="stage">
        <canvas id="game" width="320" height="240"></canvas>
        <div id="scanlines"></div>
    </div>
    <div id="legend">
        HOST CONTROLS &mdash; <b>SPACE</b>: advance / reveal answer &nbsp;|&nbsp;
        <b>&uarr; UP</b>: room mostly got it right &nbsp;|&nbsp;
        <b>&darr; DOWN</b>: room mostly missed it
    </div>

    <script src="js/constants.js"></script>
    <script src="js/pixelfont.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/images.js"></script>
    <script src="js/art.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>

    <script>
        window.addEventListener('load', function () {
            var canvas = document.getElementById('game');
            CY.Game.init(canvas);
        });
    </script>
</body>
</html>
