<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Peak Performance: Last Delivery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;
            cursor: none;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
        }
        #scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.05) 2px,
                rgba(0,0,0,0.05) 4px
            );
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="game" width="320" height="224"></canvas>
    <div id="scanlines"></div>

    <!-- Game scripts in dependency order -->
    <script src="js/constants.js"></script>
    <script src="js/input.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/road.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/coach-lines.js"></script>
    <script src="js/coach.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/hud.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/game.js"></script>

    <script>
        window.addEventListener('load', function () {
            var canvas = document.getElementById('game');

            function resizeCanvas() {
                var windowW = window.innerWidth;
                var windowH = window.innerHeight;
                var scale = Math.min(
                    windowW / 320,
                    windowH / 224
                );
                scale = Math.max(scale, 1);
                canvas.style.width = (320 * scale) + 'px';
                canvas.style.height = (224 * scale) + 'px';
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            PPLD.Game.init(canvas);
        });
    </script>
</body>
</html>
